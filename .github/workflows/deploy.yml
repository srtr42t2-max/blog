name: Deploy to Pages Branch

on:
  # 每次推送到 `main` 分支时触发这个"工作流程"
  # 如果你使用了别的分支名，请按需将 `main` 替换成你的分支名
  push:
    branches: [ main ]
  # 允许你在 GitHub 上的 Actions 标签中手动触发此"工作流程"
  workflow_dispatch:

# 需要写入权限来推送到pages分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        with:
          submodules: true  # 支持 Git Submodule 模式
          token: ${{ secrets.GITHUB_TOKEN }}  # 自动访问同账号下的私有仓库
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Mizuki 要求 Node >= 22
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        run: |
          pnpm run build
          # 重组产物:全部内容移入 blog/ 子目录(与 base 对应),
          # 并在分支根放置 .nojekyll,禁用 Jekyll 以免 _astro 等
          # 下划线开头的目录被静默忽略
          cd dist
          mkdir blog
          find . -mindepth 1 -maxdepth 1 ! -name blog -exec mv {} blog/ \;
          touch .nojekyll

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages # 部署到pages分支
          folder: dist # 产物已重组为 blog/ 结构并含根级 .nojekyll
          clean: true # 清理目标分支中的旧文件
