name: Deploy to GitHub Pages

on:
  # 每次推送到 `main` 分支时触发部署
  push:
    branches: [main]
  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:

# 授予部署 GitHub Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署任务,新提交取消旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Mizuki 要求 Node >= 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: |
          pnpm run build
          # 重组产物:全部内容移入 blog/ 子目录(与 astro.config.mjs 的 base 对应)
          cd dist
          mkdir blog
          find . -mindepth 1 -maxdepth 1 ! -name blog -exec mv {} blog/ \;

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
